<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<!-- DEMO: gumagana nang walang Node.js / MySQL -->
<script src="demo-api.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ComLab IMS — Archive</title>
<link rel="icon" href="logo2.jfif" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<!-- Bootstrap 5.3.8 (loads first so ComLab styles override it) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" crossorigin="anonymous" />
<link rel="stylesheet" href="comlab.css" />
<link rel="stylesheet" href="comlab-fx.css" />
<link rel="stylesheet" href="comlab-bootstrap.css" />
<link rel="stylesheet" href="comlab-v3.css?v=1" />

</head>
<body>
<script src="comlab-fx.js"></script>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <button class="mobile-toggle" id="mobileToggle" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round"/></svg>
      </button>
      <div class="page-title">
        <h1 id="pageTitle">Archive</h1>
        <span class="crumbs" id="pageCrumbs">Operations / Archive</span>
      </div>
      <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
        <input type="text" placeholder="Search archived records..." id="globalSearch" autocomplete="off" />
      </div>
      <div class="user-area">
        <div class="user-info"><span class="name" id="userName">—</span></div>
        <div class="avatar" id="userAvatar">U</div>
        <button class="icon-btn danger" id="logoutBtn" title="Logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div class="content">
      <div class="tabs">
        <button class="tab-btn is-active" data-tab="eq">Equipment <span class="pill role" id="cntEq">0</span></button>
        <button class="tab-btn" data-tab="mt">Maintenance Records <span class="pill role" id="cntMt">0</span></button>
      </div>

      <div class="note-banner" id="techNote" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01" stroke-linecap="round"/></svg>
        <div>Restoring a record sends a request to the <strong>Laboratory Coordinator</strong> for approval.</div>
      </div>

      <div class="tab-pane is-active" id="pane-eq">
        <div class="card">
          <div class="card-head"><div><h2>Archived Equipment</h2><span class="head-sub" id="subEq">—</span></div></div>
          <div class="table-wrap" id="wrapEq"></div>
        </div>
      </div>
      <div class="tab-pane" id="pane-mt">
        <div class="card">
          <div class="card-head"><div><h2>Archived Maintenance Records</h2><span class="head-sub" id="subMt">—</span></div></div>
          <div class="table-wrap" id="wrapMt"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- VIEW DETAILS -->
<div class="modal-backdrop" id="pcModal">
  <div class="modal">
    <div class="modal-head">
      <div><h2 id="pcModalTitle">PC Set Details</h2><span class="modal-sub" id="pcModalSub">Components</span></div>
      <button class="modal-close" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg></button>
    </div>
    <div class="modal-body" id="pcModalBody"></div>
    <div class="modal-foot" id="pcModalFoot"><button type="button" class="btn btn-ghost" data-close>Close</button></div>
  </div>
</div>

<div id="toastContainer"></div>
<script src="comlab-core.js?v=6"></script>
<script>
/* ===== View details modal ===== */
const pcModal = document.getElementById("pcModal");
COMLAB.wireModal(pcModal);
function showModal(title, sub, body, foot) {
  document.getElementById("pcModalTitle").textContent = title;
  document.getElementById("pcModalSub").textContent = sub;
  document.getElementById("pcModalBody").innerHTML = body;
  document.getElementById("pcModalFoot").innerHTML = (foot || "") + '<button type="button" class="btn btn-ghost" data-close>Close</button>';
  document.querySelectorAll("#pcModalFoot [data-close]").forEach(b => b.addEventListener("click", () => COMLAB.closeModal(pcModal)));
  COMLAB.openModal(pcModal);
}

/* =========================================================
   ARCHIVE — Equipment at Maintenance records
   Coordinator: restore; Technician: request restore; Dean: view only
   ========================================================= */
const C = COMLAB;
let eq = [], mt = [];
let canRestore = false;

document.querySelectorAll(".tab-btn").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("is-active", x === b));
  document.querySelectorAll(".tab-pane").forEach(p => p.classList.toggle("is-active", p.id === "pane-" + b.dataset.tab));
}));

const ICON_VIEW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_RESTORE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function archivedCell(x) {
  return `${C.fmtDateTime(x.archivedAt)}<div class="muted" style="font-size:12px">by ${C.esc(x.archivedByName || "—")}</div>`;
}

async function restore(kind, item) {
  const label = kind === "pc" ? `PC set <strong>${C.esc(item.pcNo)}</strong>` : `maintenance record <strong>#${C.esc(item.id)}</strong>`;
  const ok = await C.confirmBox(`Restore ${label}? It will show up again in ${kind === "pc" ? "Equipment Inventory" : "Maintenance Log"}.`,
    { title: "Restore", okText: C.is("technician") ? "Request Restore" : "Restore" });
  if (!ok) return;
  const res = kind === "pc" ? await C.api.restorePc(item.id) : await C.api.restoreMaint(item.id);
  if (C.afterSave(res, "Restored.") && !res.pending) { C.closeModal(pcModal); load(); }
}

function render() {
  const q = document.getElementById("globalSearch").value.trim().toLowerCase();
  const fe = eq.filter(p => !q || [p.pcNo, p.lab, p.archivedByName, ...Object.values(p.components).flatMap(c => [c.brand, c.serial])].join(" ").toLowerCase().includes(q));
  const fm = mt.filter(l => !q || [l.id, l.pcNo, l.lab, l.componentLabel, l.description, l.archivedByName].join(" ").toLowerCase().includes(q));
  document.getElementById("cntEq").textContent = eq.length;
  document.getElementById("cntMt").textContent = mt.length;
  document.getElementById("subEq").textContent = `${fe.length} archived PC set${fe.length === 1 ? "" : "s"}`;
  document.getElementById("subMt").textContent = `${fm.length} archived record${fm.length === 1 ? "" : "s"}`;

  const we = document.getElementById("wrapEq");
  we.innerHTML = !fe.length ? C.emptyStateHTML(eq.length ? "No match" : "Archive is empty", eq.length ? "Nothing matches your search." : "Archived PC sets will appear here.")
    : `<table class="table"><thead><tr><th>Asset ID</th><th>Previous Lab</th><th>Last Status</th><th>Archived</th><th>Actions</th></tr></thead><tbody>${
      fe.map(p => `<tr data-id="${C.esc(p.id)}">
        <td class="cell-strong cell-mono">${C.esc(p.pcNo)}</td><td>${C.esc(p.lab)}</td><td>${C.statusBadge(p.status)}</td>
        <td>${archivedCell(p)}</td>
        <td><div class="actions-cell">
          <button class="action-btn" data-act="view" title="View Details">${ICON_VIEW}</button>
          ${canRestore ? `<button class="action-btn qr" data-act="restore" title="Restore">${ICON_RESTORE}</button>` : ""}
        </div></td></tr>`).join("")}</tbody></table>`;
  we.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {
    const p = eq.find(x => x.id === b.closest("tr").dataset.id);
    if (!p) return;
    if (b.dataset.act === "restore") return restore("pc", p);
    showModal(p.pcNo, `Previous lab: ${p.lab} · archived ${C.fmtDateTime(p.archivedAt)} by ${p.archivedByName || "—"}`,
      C.pcDetailsHTML(p), canRestore ? '<button type="button" class="btn btn-primary" id="mRestore">Restore</button>' : "");
    const r = document.getElementById("mRestore");
    if (r) r.addEventListener("click", () => restore("pc", p));
  }));

  const wm = document.getElementById("wrapMt");
  wm.innerHTML = !fm.length ? C.emptyStateHTML(mt.length ? "No match" : "Archive is empty", mt.length ? "Nothing matches your search." : "Archived maintenance records will appear here.")
    : `<table class="table"><thead><tr><th>Record</th><th>Date</th><th>PC No.</th><th>Laboratory</th><th>Component</th><th>Type</th><th>Archived</th><th>Actions</th></tr></thead><tbody>${
      fm.map(l => `<tr data-id="${C.esc(l.id)}">
        <td class="cell-mono">#${C.esc(l.id)}</td><td>${C.fmtDate(l.date)}</td>
        <td class="cell-strong cell-mono">${C.esc(l.pcNo)}</td><td>${C.esc(l.lab)}</td>
        <td>${C.esc(l.componentLabel)}</td><td>${C.esc(C.MAINT_TYPE_LABELS[l.type] || l.type)}</td>
        <td>${archivedCell(l)}</td>
        <td><div class="actions-cell">
          <button class="action-btn" data-act="view" title="View Details">${ICON_VIEW}</button>
          ${canRestore ? `<button class="action-btn qr" data-act="restore" title="Restore">${ICON_RESTORE}</button>` : ""}
        </div></td></tr>`).join("")}</tbody></table>`;
  wm.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {
    const l = mt.find(x => x.id === b.closest("tr").dataset.id);
    if (!l) return;
    if (b.dataset.act === "restore") return restore("mt", l);
    showModal(`Maintenance #${l.id}`, `${l.pcNo} · ${l.lab}`,
      `<dl class="kv">
        <dt>Date</dt><dd>${C.fmtDate(l.date)}</dd>
        <dt>PC Set</dt><dd>${C.esc(l.pcNo)} (${C.esc(l.lab)})</dd>
        <dt>Component</dt><dd>${C.esc(l.componentLabel)}</dd>
        <dt>Type</dt><dd>${C.esc(C.MAINT_TYPE_LABELS[l.type] || l.type)}</dd>
        <dt>Technician</dt><dd>${C.esc(l.technician) || "—"}</dd>
        <dt>Status</dt><dd>${C.maintStatusBadge(l.status)}</dd>
        <dt>Description</dt><dd>${C.esc(l.description)}</dd>
        <dt>Parts Replaced</dt><dd>${C.esc(l.partsReplaced) || "—"}</dd>
        <dt>Archived</dt><dd>${C.fmtDateTime(l.archivedAt)} by ${C.esc(l.archivedByName || "—")}</dd>
      </dl>`, canRestore ? '<button type="button" class="btn btn-primary" id="mRestore">Restore</button>' : "");
    const r = document.getElementById("mRestore");
    if (r) r.addEventListener("click", () => restore("mt", l));
  }));
}

async function load() {
  const [a, b] = await Promise.all([C.api.pcs(true), C.api.maintenance(true)]);
  if (!a.ok) C.showToast(a.error, "error");
  eq = a.ok ? a.items.sort((x, y) => String(y.archivedAt).localeCompare(String(x.archivedAt))) : [];
  mt = b.ok ? b.items.sort((x, y) => String(y.archivedAt).localeCompare(String(x.archivedAt))) : [];
  render();
}
document.getElementById("globalSearch").addEventListener("input", render);

(async function boot() {
  if (!(await C.init())) return;
  canRestore = C.is("coordinator", "technician");
  document.getElementById("techNote").style.display = C.is("technician") ? "" : "none";
  if (location.hash === "#maintenance") document.querySelector('.tab-btn[data-tab="mt"]').click();
  load();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
